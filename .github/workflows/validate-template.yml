# validate-template.yml - Validate template generation with different configurations
#
# This workflow ensures that templates generate working projects across
# all supported configuration combinations (auth providers, features).
#
# Runs on:
# - Push to main (when template-related files change)
# - Pull requests to main

name: Validate Template

on:
  workflow_call:  # Allow reuse from publish-template.yml
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'copier.yaml'
      - '_tasks.py'
      - 'scripts/templatize.sh'
      - 'src/**'
      - 'package.json'
      - 'Dockerfile'
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # expect_* fields assert that non-identity copier answers actually reach
        # generated files (ticket #14). Multi-value fields are `|`-separated.
        #   expect_env         KEY=value lines expected in .env.development/.env.example
        #   expect_vite_port   dev-server port literal expected in vite.config.ts
        #   expect_devspace    VITE_USE_MOCKS=<v> / API_URL_DEFAULT=<v> expected in devspace.yaml
        #   expect_description "description" value expected in package.json
        include:
          - name: default
            data_args: ""
            expect_env: "VITE_AUTH_PROVIDER=mock|VITE_USE_MOCKS=true|VITE_API_URL=http://localhost:8000"
            expect_devspace: "VITE_USE_MOCKS=true|API_URL_DEFAULT=http://localhost:8000"
            expect_description: "A React frontend application"
          - name: auth-ory
            data_args: "--data auth_enabled=true --data auth_provider=ory"
            expect_env: "VITE_AUTH_PROVIDER=ory"
          - name: no-mocks
            data_args: "--data use_mocks=false"
            expect_env: "VITE_USE_MOCKS=false"
            expect_devspace: "VITE_USE_MOCKS=false|API_URL_DEFAULT=http://localhost:8000"
          - name: custom-port-and-api
            data_args: '--data port=4000 --data api_url=http://backend.internal:9000 --data description="Custom Test App"'
            expect_env: "VITE_API_URL=http://backend.internal:9000"
            expect_vite_port: "4000"
            expect_devspace: "VITE_USE_MOCKS=true|API_URL_DEFAULT=http://backend.internal:9000"
            expect_description: "Custom Test App"

    name: Validate (${{ matrix.name }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python for Copier
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run templatize script
        run: |
          chmod +x ./scripts/templatize.sh
          ./scripts/templatize.sh .templatized

      - name: Install Copier
        run: pipx install copier

      - name: Generate project (${{ matrix.name }})
        run: |
          copier copy .templatized /tmp/test-project \
            --defaults --trust \
            --data project_name="Test Project" \
            ${{ matrix.data_args }}

      # .env.example is checked alongside .env.development: _tasks.py copies it to
      # .env.development.local, which Vite loads with higher precedence.
      - name: Assert env wiring differs per answer
        if: matrix.expect_env
        env:
          EXPECT_ENV: ${{ matrix.expect_env }}
        run: |
          IFS='|' read -ra LINES <<< "${EXPECT_ENV}"
          for envfile in .env.development .env.example; do
            for line in "${LINES[@]}"; do
              grep -qxF "${line}" "/tmp/test-project/${envfile}" \
                || { echo "Missing ${envfile} line: ${line}"; exit 1; }
            done
          done
          echo "OK: env wiring (${EXPECT_ENV})"

      - name: Assert vite.config.ts port wiring
        if: matrix.expect_vite_port
        env:
          EXPECT_VITE_PORT: ${{ matrix.expect_vite_port }}
        run: |
          grep -qF "port: ${EXPECT_VITE_PORT}," /tmp/test-project/vite.config.ts \
            || { echo "Missing vite.config.ts port: ${EXPECT_VITE_PORT}"; exit 1; }
          grep -qF "port: \"${EXPECT_VITE_PORT}\"" /tmp/test-project/devspace.yaml \
            || { echo "Missing DevSpace UI port: ${EXPECT_VITE_PORT}"; exit 1; }
          grep -qF "containerPort: ${EXPECT_VITE_PORT}" /tmp/test-project/devspace.yaml \
            || { echo "Missing DevSpace container port: ${EXPECT_VITE_PORT}"; exit 1; }
          grep -qF "targetPort: ${EXPECT_VITE_PORT}" /tmp/test-project/devspace.yaml \
            || { echo "Missing DevSpace service target port: ${EXPECT_VITE_PORT}"; exit 1; }
          grep -qF "EXPOSE ${EXPECT_VITE_PORT}" /tmp/test-project/docker/Dockerfile \
            || { echo "Missing Docker dev port: ${EXPECT_VITE_PORT}"; exit 1; }
          grep -qF "http://localhost:${EXPECT_VITE_PORT}" /tmp/test-project/playwright.config.ts \
            || { echo "Missing Playwright port: ${EXPECT_VITE_PORT}"; exit 1; }
          echo "OK: vite.config.ts port ${EXPECT_VITE_PORT}"

      - name: Assert devspace.yaml wiring differs per answer
        if: matrix.expect_devspace
        env:
          EXPECT_DEVSPACE: ${{ matrix.expect_devspace }}
        run: |
          IFS='|' read -ra PAIRS <<< "${EXPECT_DEVSPACE}"
          for pair in "${PAIRS[@]}"; do
            key="${pair%%=*}"; val="${pair#*=}"
            case "$key" in
              VITE_USE_MOCKS)
                grep -A1 'name: VITE_USE_MOCKS' /tmp/test-project/devspace.yaml | grep -qF "value: \"${val}\"" \
                  || { echo "Missing devspace.yaml VITE_USE_MOCKS=${val}"; exit 1; }
                ;;
              API_URL_DEFAULT)
                grep -A1 '  API_URL:' /tmp/test-project/devspace.yaml | grep -qF "default: \"${val}\"" \
                  || { echo "Missing devspace.yaml API_URL default=${val}"; exit 1; }
                ;;
              *)
                echo "Unknown expect_devspace key: ${key}"; exit 1
                ;;
            esac
          done
          echo "OK: devspace.yaml wiring (${EXPECT_DEVSPACE})"

      - name: Assert package.json description wiring
        if: matrix.expect_description
        env:
          EXPECT_DESCRIPTION: ${{ matrix.expect_description }}
        run: |
          grep -qF "\"description\": \"${EXPECT_DESCRIPTION}\"" /tmp/test-project/package.json \
            || { echo "Missing package.json description=${EXPECT_DESCRIPTION}"; exit 1; }
          echo "OK: package.json description"

      # Scoped to the paths ticket #14 touches -- a repo-wide grep would
      # false-positive on JSX {{ }} object literals and Actions ${{ }} syntax.
      - name: Check no unrendered template markers in fixed paths
        run: |
          if grep -rnE '\{\{|\{%|__PROJECT_(NAME|SLUG|SLUG_UNDERSCORE)__' \
            /tmp/test-project/.env.development \
            /tmp/test-project/.env.example \
            /tmp/test-project/vite.config.ts \
            /tmp/test-project/devspace.yaml \
            /tmp/test-project/deployment \
            /tmp/test-project/tests; then
            echo "Unrendered template marker found"
            exit 1
          fi
          echo "OK: no unrendered template markers"

      - name: Install dependencies
        run: cd /tmp/test-project && npm install

      - name: Lint (biome)
        run: cd /tmp/test-project && npm run lint

      - name: Type check (tsc)
        run: cd /tmp/test-project && npm run typecheck

      # Build step skipped: requires generated API types from backend OpenAPI spec
      # Users run `npm run generate:types` after setting up backend integration

      - name: Summary
        if: always()
        run: |
          echo "## Validation: ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Configuration: \`${{ matrix.data_args || 'defaults' }}\`" >> $GITHUB_STEP_SUMMARY
